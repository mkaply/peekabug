<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: transparent; }
    body { font: small Arial, Helvetica, sans-serif; overflow: hidden; }
    .muted { opacity: 0.7; }
    .set { margin-bottom: 1em; }
    .header { font-weight: bold; margin-bottom: 0.5em; }
    .header .muted { font-weight: normal; }
    table { border-collapse: collapse; margin-bottom: 0.75em; }
    th, td {
      border: 1px solid rgba(128, 128, 128, 0.4);
      padding: 2px 8px;
      text-align: left;
      vertical-align: top;
    }
    th { background: rgba(128, 128, 128, 0.12); }
    .comment-link { margin-bottom: 0.25em; }
    .comment { white-space: pre-wrap; margin-bottom: 0.75em; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <script src="view.js"></script>
</body>
</html>
